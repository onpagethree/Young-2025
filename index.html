		<script>
			// 이미지 및 글 가져오기
			document.addEventListener("DOMContentLoaded", () => {
				hydrateProjectCardsByThumbId();
				applyColorForDesktop?.();
				initCategoryFilter(); // 기존 카테고리 로직을 하나로 합친 버전
			});

			async function hydrateProjectCardsByThumbId() {
				const boxes = Array.from(document.querySelectorAll(".container a.box"));

				async function fetchDoc(url) {
					const res = await fetch(url, { cache: "no-store" });
					if (!res.ok) throw new Error(res.status + " " + res.statusText);
					const text = await res.text();
					const doc = new DOMParser().parseFromString(text, "text/html");
					const base = new URL(url, window.location.href);
					return { doc, base };
				}

				for (const box of boxes) {
					const projectUrl = box.dataset.src || box.getAttribute("href");
					if (!projectUrl) continue;

					try {
						const { doc, base } = await fetchDoc(projectUrl);

						// 1) title / credit
						const titleNode = doc.querySelector(".project-info .title");
						const creditNode = doc.querySelector(".project-info .info-credit");

						const titleTarget = box.querySelector(".text-container .title");
						const creditTarget = box.querySelector(
							".text-container .info-credit"
						);

						if (titleNode && titleTarget)
							titleTarget.innerHTML = titleNode.innerHTML.trim();
						if (creditNode && creditTarget)
							creditTarget.innerHTML = creditNode.innerHTML.trim();

						// 2) thumbs: id="thumb"만 (여러 개여도 [id="thumb"]로 안전하게)
						const thumbSrcs = Array.from(doc.querySelectorAll('[id="thumb"]'))
							.map((el) => el.getAttribute("src"))
							.filter(Boolean);

						const thumbBox = box.querySelector(".thumbnail-box");
						if (!thumbBox) continue;

						let thumbRow = thumbBox.querySelector(".thumb-row");
						if (!thumbRow) {
							thumbRow = document.createElement("div");
							thumbRow.className = "thumb-row";
							thumbBox.appendChild(thumbRow);
						}

						thumbRow.innerHTML = "";

						thumbSrcs.forEach((src) => {
							const img = document.createElement("img");
							img.className = "thumb-image";
							img.src = new URL(src, base).href; // 상대경로 보정
							img.alt = "";
							img.loading = "lazy";
							thumbRow.appendChild(img);
						});
					} catch (err) {
						console.warn("hydrate failed:", projectUrl, err);
					}
				}
			}

			// 카테고리 필터: 중복된 addEventListener 2세트를 하나로 정리
			// 카테고리 필터: .category a 클릭 시 .box 요소를 필터링
			document.addEventListener("DOMContentLoaded", () => {
				const categoryLinks = Array.from(
					document.querySelectorAll(".category a[href^='#']")
				);
				const boxes = Array.from(document.querySelectorAll(".container a.box"));
				const flexParents = Array.from(document.querySelectorAll(".box-flex"));

				function setSelected(active) {
					categoryLinks.forEach((a) =>
						a.classList.toggle("selected", a === active)
					);
				}

				function updateBoxFlexParents() {
					flexParents.forEach((parent) => {
						const childBoxes = Array.from(parent.querySelectorAll("a.box"));
						const anyVisible = childBoxes.some(
							(b) => getComputedStyle(b).display !== "none"
						);
						parent.style.display = anyVisible ? "" : "none";
					});
				}

				function show(category) {
					if (category === "all") {
						boxes.forEach((b) => (b.style.display = ""));
						updateBoxFlexParents();
						return;
					}
					boxes.forEach((b) => {
						b.style.display = b.classList.contains(category) ? "" : "none";
					});
					updateBoxFlexParents();
				}

				// 초기 상태: URL hash 반영
				const hash = (location.hash || "#all").slice(1);
				const initialLink =
					categoryLinks.find(
						(a) => (a.getAttribute("href") || "").slice(1) === hash
					) || categoryLinks.find((a) => a.getAttribute("href") === "#all");

				if (initialLink) {
					setSelected(initialLink);
					show((initialLink.getAttribute("href") || "#all").slice(1));
				}

				categoryLinks.forEach((link) => {
					link.addEventListener("click", (e) => {
						e.preventDefault();
						const category = (link.getAttribute("href") || "#all").slice(1);
						setSelected(link);
						show(category);
						history.replaceState(null, "", `#${category}`);
					});
				});
			});
			// Mail Copied
			const mailLinks = document.querySelectorAll(".copy-mail");

			mailLinks.forEach((link) => {
				link.addEventListener("click", (e) => {
					e.preventDefault();
					const mail = link.dataset.mail;

					// toast 요소 생성/사용
					let toast = document.getElementById("toast-footer");
					if (!toast) {
						toast = document.createElement("div");
						toast.id = "toast-footer";
						toast.textContent = "Copied to clipboard";
						toast.style.position = "absolute";
						toast.style.padding = "0.4em 1.2em";
						toast.style.background = "rgba(235, 235, 235, 0.8)";
						toast.style.color = "#000";
						toast.style.borderRadius = "8px";
						toast.style.fontSize = "0.9em";
						toast.style.opacity = "0";
						toast.style.transition = "opacity .8s ease";
						document.body.appendChild(toast);
					}

					// 상위 div 기준 toast 위치 계산
					let parentDiv = link.closest("footer"); // footer 기준
					if (!parentDiv) parentDiv = link.closest(".contact"); // footer 없으면 contact 기준

					const rect = parentDiv.getBoundingClientRect();
					toast.style.left = rect.left + rect.width / 2 + "px";
					toast.style.top = rect.top - 75 + window.scrollY + "px"; // 위로 띄움
					toast.style.transform = "translateX(-50%)";

					navigator.clipboard.writeText(mail).then(() => {
						toast.style.opacity = "1";
						setTimeout(() => {
							toast.style.opacity = "0";
						}, 1000);
					});
				});
			});
		</script>
