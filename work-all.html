		<script>
			// 라이트박스
			(function ($) {
				$(function () {
					const $lightbox = $("#lightbox");
					const $img = $("#lightbox-img");
					const $prev = $(".lightbox .prev");
					const $next = $(".lightbox .next");
					const $close = $(".lightbox .close");
					const $center = $(".lightbox .lightbox-center");

					let $currentGallery = null;
					let srcs = [];
					let idx = 0;

					function openGallery($gallery, startIndex) {
						$currentGallery = $gallery;
						srcs = $gallery
							.find(".gallery-box")
							.map(function () {
								return this.getAttribute("href");
							})
							.get();

						idx = startIndex;
						update();
						$lightbox.show();
						$("body").addClass("lightbox-open no-scroll");
					}

					function close() {
						$lightbox.hide();
						$("body").removeClass("lightbox-open no-scroll");
						$currentGallery = null;
						srcs = [];
						idx = 0;
					}

					function update() {
						if (!srcs.length) return;
						$img.attr("src", srcs[idx]);
					}

					function prev() {
						if (!srcs.length) return;
						idx = (idx - 1 + srcs.length) % srcs.length;
						update();
					}

					function next() {
						if (!srcs.length) return;
						idx = (idx + 1) % srcs.length;
						update();
					}

					// 썸네일 클릭
					$(".image-gallery").on("click", ".gallery-box", function (e) {
						e.preventDefault();
						const $gallery = $(this).closest(".image-gallery");
						const i = $gallery.find(".gallery-box").index(this);
						openGallery($gallery, i);
					});

					// 버튼
					$prev.on("click", function (e) {
						e.stopPropagation();
						prev();
					});
					$next.on("click", function (e) {
						e.stopPropagation();
						next();
					});
					$close.on("click", function (e) {
						e.stopPropagation();
						close();
					});

					// 오버레이 빈 공간 클릭 시 닫기
					$lightbox.on("click", function (e) {
						// lightbox-center 바깥을 클릭한 경우에만 닫기
						if ($(e.target).closest(".lightbox-center").length === 0) {
							close();
						}
					});

					// 라이트박스 내부 클릭은 전파 막기(이미지/버튼 클릭 시 오버레이로 전파되어 닫히는 문제 방지)
					$center.on("click", function (e) {
						e.stopPropagation();
					});

					// 키보드 제어
					$(document).on("keydown", function (e) {
						if (!$lightbox.is(":visible")) return;
						if (e.key === "Escape") close();
						if (e.key === "ArrowLeft") prev();
						if (e.key === "ArrowRight") next();
					});

					// 터치 스와이프
					let startX = null;
					$center.on("touchstart", function (e) {
						startX = e.originalEvent.touches[0].clientX;
					});
					$center.on("touchend", function (e) {
						if (startX == null) return;
						const dx = e.originalEvent.changedTouches[0].clientX - startX;
						if (dx > 40) prev();
						if (dx < -40) next();
						startX = null;
					});
				});
			})(jQuery);

			// box 가져오기
			async function hydrateCardsFromProjectPages() {
				const cards = document.querySelectorAll(".box[data-src]");

				for (const card of cards) {
					const src = card.getAttribute("data-src");
					if (!src) continue;

					try {
						const res = await fetch(src, { cache: "no-store" });
						if (!res.ok) continue;

						const html = await res.text();
						const doc = new DOMParser().parseFromString(html, "text/html");

						// 1) title / credit
						const titleEl = doc.querySelector(".project-info .title");
						const creditEl = doc.querySelector(".project-info .info-credit");

						const targetTitle = card.querySelector(".text-container .title");
						const targetCredit = card.querySelector(
							".text-container .info-credit"
						);

						if (titleEl && targetTitle)
							targetTitle.innerHTML = titleEl.innerHTML.trim();
						if (creditEl && targetCredit)
							targetCredit.innerHTML = creditEl.innerHTML.trim();

						// 2) 이미지 1~3: 상세페이지의 "첫번째 본문 이미지" + 첫 갤러리 2장 조합(안정적)
						const firstHero = doc.querySelector(".container > img");
						const galleryImgs = Array.from(
							doc.querySelectorAll(".image-gallery img")
						).slice(0, 2);

						const picked = [];
						if (firstHero) picked.push(firstHero);
						picked.push(...galleryImgs);

						const thumbRow = card.querySelector(".thumb-row");
						if (!thumbRow) continue;

						thumbRow.innerHTML = "";

						picked.slice(0, 3).forEach((img) => {
							const thumb = document.createElement("img");
							thumb.src = img.getAttribute("src");
							thumb.alt = "";
							thumb.loading = "lazy";
							thumbRow.appendChild(thumb);
						});

						// 3) 최후 fallback: 이미지가 하나도 못 잡히면 상세페이지의 첫 img 전체에서 3개
						if (!thumbRow.children.length) {
							const imgs = Array.from(doc.querySelectorAll("img"))
								.filter((i) => i.getAttribute("src"))
								.slice(0, 3);

							imgs.forEach((img) => {
								const thumb = document.createElement("img");
								thumb.src = img.getAttribute("src");
								thumb.alt = "";
								thumb.loading = "lazy";
								thumbRow.appendChild(thumb);
							});
						}
					} catch (e) {
						console.error("hydrate failed:", src, e);
					}
				}
			}

			document.addEventListener(
				"DOMContentLoaded",
				hydrateCardsFromProjectPages
			);
		</script>

		<script>
			(async function hydrateProjectCards() {
				const boxes = Array.from(document.querySelectorAll(".container a.box"));

				async function fetchDoc(url) {
					const res = await fetch(url);
					if (!res.ok) throw new Error(res.status + " " + res.statusText);
					const text = await res.text();
					const doc = new DOMParser().parseFromString(text, "text/html");
					const base = new URL(url, window.location.href);
					return { doc, base };
				}

				for (const box of boxes) {
					const projectUrl = box.dataset.src || box.getAttribute("href");
					if (!projectUrl) continue;

					try {
						const { doc, base } = await fetchDoc(projectUrl);

						// 이미지 소스 수집: <img src> 우선, gallery a[href] 보조
						const imgSrcs = Array.from(doc.querySelectorAll("img"))
							.map((i) => i.getAttribute("src"))
							.filter(Boolean);
						const gallerySrcs = Array.from(
							doc.querySelectorAll("a.gallery-box")
						)
							.map((a) => a.getAttribute("href"))
							.filter(Boolean);
						const picked = imgSrcs.concat(gallerySrcs).slice(0, 3);

						// thumbnail-box에 이미지 삽입 (기존 내용 대체)
						const thumbBox = box.querySelector(".thumbnail-box");
						if (thumbBox) {
							// 항상 .thumb-row를 찾거나 없으면 생성
							let thumbRow = thumbBox.querySelector(".thumb-row");
							if (!thumbRow) {
								thumbRow = document.createElement("div");
								thumbRow.className = "thumb-row";
								thumbBox.appendChild(thumbRow);
							}
							thumbRow.innerHTML = ""; // 초기화

							if (picked.length === 0) {
								const placeholder = document.createElement("div");
								placeholder.className = "thumb-row";
								thumbBox.appendChild(placeholder);
							} else {
								picked.forEach((src, idx) => {
									const img = document.createElement("img");
									img.className = "thumb-image";
									img.src = new URL(src, base).href;
									img.alt = "";
									thumbRow.appendChild(img);
								});
							}
						}

						// title 추출 (프로젝트 페이지 구조에 맞춰 선택자 사용)
						const titleNode =
							doc.querySelector(".project-info .title") ||
							doc.querySelector(".title");
						const textContainer = box.querySelector(".text-container");
						if (textContainer && titleNode) {
							// 기존 title 요소 찾거나 생성
							let titleTarget =
								textContainer.querySelector(".text-container-title") ||
								textContainer.querySelector(".title");
							if (!titleTarget) {
								titleTarget = document.createElement("div");
								titleTarget.className = "text-container-title";
								textContainer.prepend(titleTarget);
							}
							titleTarget.innerHTML = titleNode.innerHTML;
						}

						// info-credit 복사
						const infoNode = doc.querySelector(".info-credit");
						if (textContainer && infoNode) {
							let infoTarget = textContainer.querySelector(".info-credit");
							if (!infoTarget) {
								infoTarget = document.createElement("div");
								infoTarget.className = "info-credit";
								textContainer.appendChild(infoTarget);
							}
							infoTarget.innerHTML = infoNode.innerHTML;
						}
					} catch (err) {
						// 실패하면 콘솔에 경고만 남김
						console.warn("Failed to hydrate project card:", projectUrl, err);
					}
				}
			})();
		</script>
	</body>
</html>
